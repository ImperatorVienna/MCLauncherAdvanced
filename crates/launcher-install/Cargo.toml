[package]
license = "GPL-3.0-only"
name = "launcher-install"
version = "0.1.0"
edition = "2021"
[dependencies]
launcher-platform = { path = "../launcher-platform" }
launcher-core = { path = "../launcher-core" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
sha1 = "0.10"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
regex = "1"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

