[package]
license = "GPL-3.0-only"
name = "launcher-platform"
version = "0.1.0"
edition = "2021"
[dependencies]
base64 = "0.22"
launcher-core = { path = "../launcher-core" }
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
gilrs = { version = "0.11.2", default-features = false, features = ["wgi"] }
serde = { version = "1", features = ["derive"] }
